name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install poetry==2.4.1
          poetry config virtualenvs.in-project true
          poetry install
          poetry check --lock
      - name: Run pre-commit checks and unit tests
        run: poetry run pre-commit run --all-files
      - name: Initialize local configuration
        run: cp .env.example .env
      - name: Run integration tests on isolated PostgreSQL and Redis
        run: docker compose --profile test run --build --rm tests poetry run pytest tests/integration
      - name: Verify startup and documented HTTP examples
        run: |
          docker compose up --build --wait
          docker compose exec -T app python -m api.demo_user
          TOKEN=$(curl --fail-with-body -sS http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"testuser","password":"test-password"}' \
            | docker compose exec -T app python -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          export TOKEN
          python - <<'PY'
          import json
          import os
          import tomllib
          import urllib.request

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          with urllib.request.urlopen("http://localhost:8000/health/ready", timeout=5) as response:
              assert response.status == 200 and response.read() == b""
          with urllib.request.urlopen("http://localhost:8000/health/live", timeout=5) as response:
              payload = json.load(response)
          assert payload == {"status": "ok", "version": version}, payload
          request = urllib.request.Request(
              "http://localhost:8000/api/v1/auth/me",
              headers={"Authorization": "Bearer " + os.environ["TOKEN"]},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              user = json.load(response)
          assert user["username"] == "testuser" and user["is_active"]
          for path in ("examples/request-tle.json", "examples/request-omm.json"):
              with open(path, "rb") as stream:
                  request = urllib.request.Request(
                      "http://localhost:8000/api/v1/orbits/coordinates",
                      data=stream.read(),
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": "Bearer " + os.environ["TOKEN"],
                      },
                  )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result["reference_frame"] == "WGS84" and result["point_count"] == 61
              assert len(result["points"]) == 61
          with urllib.request.urlopen("http://localhost:8000/metrics", timeout=5) as response:
              metrics = response.read().decode()
              assert response.status == 200
          assert 'orbit_http_requests_total{method="POST",route="/api/v1/orbits/coordinates",status="200"} 2.0' in metrics
          assert "orbit_http_request_duration_seconds_bucket" in metrics
          PY
      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile test logs --no-color
      - name: Stop isolated CI environment
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
