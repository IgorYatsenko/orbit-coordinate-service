name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install poetry==2.4.1
          poetry config virtualenvs.in-project true
          poetry install
          poetry check --lock
      - name: Run pre-commit checks and unit tests
        run: poetry run pre-commit run --all-files
      - name: Initialize local configuration
        run: cp .env.example .env
      - name: Run integration tests on isolated PostgreSQL and Redis
        run: docker compose --profile test run --build --rm tests poetry run pytest tests/integration
      - name: Verify startup and documented HTTP examples
        run: |
          docker compose up --build --wait
          poetry run poe add-test-user
          python - <<'PY'
          import json
          import tomllib
          import urllib.request

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          with urllib.request.urlopen("http://localhost:8000/health/ready", timeout=5) as response:
              payload = json.load(response)
          assert payload == {"status": "ok", "version": version, "database": "ok", "compute": "ok", "redis": "ok"}, payload
          request = urllib.request.Request(
              "http://localhost:8000/api/v1/auth/login",
              data=json.dumps({"username": "testuser", "password": "test-password"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              login = json.load(response)
          assert login["token_type"] == "bearer" and login["access_token"]
          for path in ("examples/request-tle.json", "examples/request-omm.json"):
              with open(path, "rb") as stream:
                  request = urllib.request.Request(
                      "http://localhost:8000/api/v1/orbits/coordinates",
                      data=stream.read(),
                      headers={
                          "Content-Type": "application/json",
                          "Authorization": "Bearer " + login["access_token"],
                      },
                  )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result["reference_frame"] == "WGS84" and result["point_count"] == 61
              assert len(result["points"]) == 61
          PY
      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile test logs --no-color
      - name: Stop isolated CI environment
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
