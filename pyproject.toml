[project]
name = "orbit-coordinate-service"
version = "1.0.1"
description = "A satellite coordinate calculation service and metadata registry."
authors = []
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.151.0,<0.152.0",
    "uvicorn>=0.54.0,<0.55.0",
    "pydantic>=2.14.1,<3.0",
    "pydantic-settings>=2.16.0,<3.0",
    "sqlalchemy[asyncio]>=2.1.5,<3.0",
    "asyncpg>=0.32.0,<0.33.0",
    "alembic>=1.20.0,<2.0",
    "skyfield (>=1.55,<2.0)",
    "sgp4 (>=2.27,<3.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "redis (>=8.1.0,<9.0.0)",
]

[tool.poetry]
packages = [{ include = "api" }, { include = "models" }]

[tool.poetry.group.dev.dependencies]
poethepoet = "^0.49.0"
ruff = "^0.17.1"
ty = ">=0.0.89,<0.1.0"
pre-commit = "^4.7.0"
pre-commit-hooks = "^6.0.0"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.4,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["api", "models", "migrations", "tests", "benchmarks"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires dedicated test PostgreSQL and Redis"]

[tool.poe.tasks]
start = "python -m api"
lint = "ruff check ."
format-check = "ruff format --check ."
format = ["lint-fix", "format-code"]
lint-fix = "ruff check --fix ."
format-code = "ruff format ."
typecheck = "ty check --error-on-warning"
test = "pytest"
test-unit = "pytest tests/unit"
test-integration = "pytest tests/integration"
migrate = "alembic upgrade head"
check-migrations = "alembic check"
hooks = "pre-commit run --all-files"
benchmark = "python -m benchmarks.run"
check = ["lint", "format-check", "typecheck", "test-unit"]

[tool.poe.tasks.create-migration]
cmd = 'alembic revision --autogenerate -m "${message}"'
args = [{ name = "message", options = ["-m"], required = true }]

[tool.poe.tasks.add-test-user]
help = "Create the demonstration user: testuser / test-password."
cmd = """python -c '
import asyncio
from api.db.users import create_if_missing
from api.services import Services
from api.settings import get_settings

async def main() -> None:
    services = Services(config=get_settings())
    try:
        await services.database.start()
        encoded = await services.passwords.hash("test-password")
        async with services.database.session() as session:
            user_id = await create_if_missing(session, username="testuser", password_hash=encoded)
        print("Test user created" if user_id else "Test user already exists")
    finally:
        await services.database.stop()

asyncio.run(main())
'"""
